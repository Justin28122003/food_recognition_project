experiment_name: "food_recognition_resnet34_adamw"
seed: 42

data:
  batch_size: 64
  num_workers: 4
  val_split: 0.2
  image_size: [224, 224]

model:
  name: "resnet34"
  num_classes: 80
  pretrained: false
  freeze_backbone: false
  dropout: 0.2

training:
  epochs: 20
  optimizer: "adamw"
  scheduler: "cosine"
  learning_rate: 0.0005
  min_learning_rate: 0.000001
  weight_decay: 0.0002
  label_smoothing: 0.05
  save_dir: "./experiments/results"