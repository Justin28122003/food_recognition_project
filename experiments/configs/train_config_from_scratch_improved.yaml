experiment_name: "food_recognition_resnet34_scratch_improved"
seed: 42

data:
  batch_size: 64
  num_workers: 4
  val_split: 0.2
  image_size: [224, 224]

model:
  name: "resnet34"
  num_classes: 80
  pretrained: false
  freeze_backbone: false
  dropout: 0.2

training:
  epochs: 60
  optimizer: "sgd"
  momentum: 0.9
  learning_rate: 0.01
  weight_decay: 0.0005

  scheduler: "onecycle"
  scheduler_interval: "batch"
  max_learning_rate: 0.05
  onecycle_pct_start: 0.2
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 10000.0
  onecycle_anneal_strategy: "cos"

  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  mix_prob: 0.5

  save_dir: "./experiments/results"
